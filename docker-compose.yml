version: "3.8"

services:
  boda-app:
    container_name: boda-valen-benja
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3008:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=valentina-benjamin-boda-secret-key-2026
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
